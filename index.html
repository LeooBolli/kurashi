<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kurashi</title>
<meta name="description" content="Abitudini, obiettivi e focus: la tua vita in un posto solo.">
<meta name="theme-color" content="#F6F2EA">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kurashi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<!-- Sfondo unico di tutta l'app (colori morbidi o foto in bianco e nero) -->
<div class="backdrop" id="backdrop" aria-hidden="true"></div>

<!-- ACCESSO -->
<section id="view-login" class="hidden">
  <div class="login-card glass">
    <svg class="logo lg" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="10" class="logo-bg"/><path d="M8 22.5a7 7 0 0 1 14 0z" class="logo-sun"/><rect x="8" y="7.5" width="3.2" height="10.5" rx="1.6" class="logo-bar"/></svg>
    <h1>Kurashi</h1>
    <p>Il tuo spazio personale.</p>
    <form id="login-form">
      <input type="email" id="login-email" name="email" autocomplete="username" placeholder="Email" required>
      <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit" class="btn primary wide">Entra</button>
    </form>
    <p id="login-status" class="login-status" role="status"></p>
  </div>
</section>

<!-- APP -->
<div id="app-shell" class="hidden">
  <aside class="sidebar" aria-label="Sezioni">
    <svg class="side-bg" aria-hidden="true"><path id="side-path"/></svg>
    <div class="brand">
      <svg class="logo" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="10" fill="#FFFFFF" fill-opacity=".18"/><path d="M8 22.5a7 7 0 0 1 14 0z" fill="var(--side-ic)"/><rect x="8" y="7.5" width="3.2" height="10.5" rx="1.6" fill="#FFFFFF"/></svg>
      <span class="brand-name">Kurashi</span>
    </div>
    <nav id="sidebar-nav" class="nav"></nav>
    <button class="btn wide side-add" data-act="quick-add">
      <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Registra</span>
    </button>
  </aside>

  <div class="main">
    <header class="topbar glass">
      <div class="brand"><svg class="logo sm" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="10" class="logo-bg"/><path d="M8 22.5a7 7 0 0 1 14 0z" class="logo-sun"/><rect x="8" y="7.5" width="3.2" height="10.5" rx="1.6" class="logo-bar"/></svg><span id="top-title" class="top-title"></span></div>
      <div class="top-actions">
        <button id="theme-btn" class="icon-btn" aria-label="Tema chiaro o scuro">
          <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <button id="menu-btn" class="icon-btn" aria-label="Menu">
          <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
      </div>
    </header>
    <div id="app-head" class="app-head"></div>
    <main id="view" class="view"></main>
  </div>

  <nav id="tabbar" class="tabbar glass" aria-label="Navigazione principale"></nav>
</div>

<div id="sheet-root"></div>
<div id="tip" class="tip" role="tooltip"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Librerie esterne (versioni fissate + integrità SRI) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"
        integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
        integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw"
        crossorigin="anonymous"></script>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/demo.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/charts.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/shell.js"></script>
<script src="js/habits.js"></script>
<script src="js/goals.js"></script>
<script src="js/today.js"></script>
<script src="js/focus.js"></script>
<script src="js/body.js"></script>
<script src="js/food.js"></script>
<script src="js/plan-keto.js"></script>
<script src="js/reading.js"></script>
<script src="js/recall.js"></script>
<script src="js/insights.js"></script>
<script src="js/export.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
